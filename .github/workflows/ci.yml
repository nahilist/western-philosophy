# ==============================================================================
# GitHub Actions CI Workflow for Western Philosophy Next.js Platform
# ------------------------------------------------------------------------------
# This workflow runs automatically whenever code is pushed or a pull request is
# opened, ensuring type safety and build integrity across all courses and pages.
# ==============================================================================

name: CI Build & Verify

# 1. TRIGGER EVENTS (When should this workflow run?)
on:
  # Triggers on push to 'main' or 'master' branch
  push:
    branches:
      - main
      - master

  # Triggers on pull requests targeting 'main' or 'master' branch
  pull_request:
    branches:
      - main
      - master

  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

# 2. JOBS (Tasks to execute)
jobs:
  build-and-test:
    name: 🚀 Verify TypeScript & Next.js Build
    # Run on GitHub-hosted Ubuntu Linux runner
    runs-on: ubuntu-latest

    # Timeout safety: stops automatically if execution exceeds 15 minutes
    timeout-minutes: 15

    steps:
      # Step 1: Check out repository code
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js (version 20) with NPM package caching
      # Caching npm packages speeds up subsequent workflow runs significantly
      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Step 3: Restore Next.js build cache (.next/cache) for faster incremental builds
      - name: ⚡ Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Cache key based on package-lock.json and source code changes
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Step 4: Clean install of dependencies according to package-lock.json
      - name: 📦 Install Project Dependencies
        run: npm ci

      # Step 5: TypeScript type check to verify type safety and catch compiler errors
      - name: 🔍 Run TypeScript Type Check
        run: npx tsc --noEmit

      # Step 6: Next.js production build and static site generation for all pages
      - name: 🏗️ Compile & Build Next.js Application
        run: npm run build
        env:
          # Disable telemetry and set production environment during CI build
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # Step 7: Display build success confirmation banner
      - name: ✅ Build Verification Succeeded
        run: |
          echo "=========================================================="
          echo "🎉 All 14 Philosophers courses and pages compiled successfully!"
          echo "🚀 Your Next.js Western Philosophy app is ready for deployment."
          echo "=========================================================="